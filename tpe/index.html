<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --ink: #1d2733;
    --muted: #5b6776;
    --line: #d9d3c5;
    --accent: #1f6f8b;
    --accent-ink: #ffffff;
    --board: #b5541c;
    --print: #5a6b2f;
    --login: #7a4a8c;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    line-height: 1.35;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--ink);
    color: #fff;
    padding: 14px 20px 12px;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: 0.02em; }
  .grades { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .grade-btn {
    min-width: 96px;
    padding: 14px 18px;
    font: inherit;
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    background: transparent;
    border: 2px solid rgba(255,255,255,0.45);
    border-radius: 12px;
    cursor: pointer;
  }
  .grade-btn[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
  .filter {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    cursor: pointer;
    user-select: none;
  }
  .filter input { width: 26px; height: 26px; accent-color: var(--board); }
  main { padding: 20px; max-width: 1500px; margin: 0 auto; }
  section { margin-bottom: 30px; }
  h2 {
    margin: 0 0 12px;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 2px solid var(--line);
    padding-bottom: 6px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card h3 { margin: 0; font-size: 1.1rem; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
    letter-spacing: 0.03em;
  }
  .tag.board { background: var(--board); }
  .tag.print { background: var(--print); }
  .tag.login { background: var(--login); }
  .links { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  a.open {
    display: block;
    padding: 16px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    border-radius: 10px;
    text-align: center;
  }
  a.open:hover, a.open:focus { filter: brightness(1.12); outline: 3px solid #f2b705; outline-offset: 2px; }
  a.open:active { transform: scale(0.98); }
  .empty { color: var(--muted); font-size: 0.9rem; }
  footer { padding: 0 20px 30px; color: var(--muted); font-size: 0.75rem; max-width: 1500px; margin: 0 auto; }
</style>
</head>

var TAG_LABEL = { board: "Πίνακας", print: "Εκτύπωση", login: "Θέλει τμήμα" };
var STORE_KEY = "tpe-grade";
var gradesEl = document.getElementById("grades");
var mainEl = document.getElementById("main");
var boardOnlyEl = document.getElementById("boardOnly");
var current = 0;

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text) node.textContent = text;
  return node;
}

function readSaved() {
  try {
    var saved = parseInt(localStorage.getItem(STORE_KEY), 10);
    if (saved >= 0 && saved < DATA.length) return saved;
  } catch (e) {}
  return 0;
}

function save(index) {
  try { localStorage.setItem(STORE_KEY, String(index)); } catch (e) {}
}

function renderGrades() {
  gradesEl.textContent = "";
  DATA.forEach(function (g, i) {
    var btn = el("button", "grade-btn", g.grade);
    btn.type = "button";
    btn.setAttribute("aria-pressed", i === current ? "true" : "false");
    btn.addEventListener("click", function () {
      current = i;
      save(i);
      renderGrades();
      renderMain();
      window.scrollTo(0, 0);
    });
    gradesEl.appendChild(btn);
  });
}

function renderCard(item) {
  var card = el("article", "card");
  card.appendChild(el("h3", null, item.t));
  if (item.tags && item.tags.length) {
    var tags = el("div", "tags");
    item.tags.forEach(function (tag) {
      tags.appendChild(el("span", "tag " + tag, TAG_LABEL[tag]));
    });
    card.appendChild(tags);
  }
  var links = el("div", "links");
  item.links.forEach(function (pair) {
    var a = el("a", "open", pair[0]);
    a.href = pair[1];
    a.target = "_blank";
    a.rel = "noopener";
    links.appendChild(a);
  });
  card.appendChild(links);
  return card;
}

function renderMain() {
  var boardOnly = boardOnlyEl.checked;
  mainEl.textContent = "";
  var shown = 0;
  DATA[current].terms.forEach(function (term) {
    var items = term.items.filter(function (item) {
      return !boardOnly || (item.tags && item.tags.indexOf("board") !== -1);
    });
    if (!items.length) return;
    var section = el("section");
    section.appendChild(el("h2", null, term.title));
    var cards = el("div", "cards");
    items.forEach(function (item) { cards.appendChild(renderCard(item)); });
    section.appendChild(cards);
    mainEl.appendChild(section);
    shown += items.length;
  });
  if (!shown) mainEl.appendChild(el("p", "empty", "Δεν υπάρχουν δραστηριότητες για τον πίνακα σε αυτή την τάξη."));
}

boardOnlyEl.addEventListener("change", renderMain);
current = readSaved();
renderGrades();
renderMain();
</script>
